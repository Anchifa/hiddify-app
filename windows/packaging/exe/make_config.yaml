# OneDash: own installer id, name and folder, so it does not replace Hiddify
app_id: B7BA41AD-515C-4422-B37A-C95002C40BDD
publisher_name: OneDash
publisher_url: https://github.com/Anchifa/hiddify-app
display_name: OneDash
create_desktop_icon: true
install_dir_name: "{autopf64}\\OneDash"
setup_icon_file: windows\runner\resources\app_icon.ico
# The first locale is the setup's language when Windows' UI language matches none.
locales:
  - en
  - ar
  - es
  - fa
  - fr
  - pt
  - ru
  - tr
  - zh
script_template: inno_setup.sas
